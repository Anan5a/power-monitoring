	-D CONFIG_FREERTOS_UNICORE=1
	-D CONFIG_BTDM_CTRL_BR_EDR_MAX_ACL_CONN=0
	-D CONFIG_BTDM_CTRL_BR_EDR_MAX_SYNC_CONN=0
	-D CONFIG_BTDM_CTRL_LEGACY_AUTH_VENDOR_EVT=0
