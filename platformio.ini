; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
board_build.partitions = custom_partitions.csv
lib_deps =
	knolleary/PubSubClient @ ^2.8
	bblanchon/ArduinoJson @ ^7.0.0
	adafruit/Adafruit INA3221 Library @ ^1.0.1
	robtillaart/INA226 @ ^0.6.6
	adafruit/Adafruit ADS1X15 @ ^2.6.2
	adafruit/Adafruit SSD1306 @ ^2.5.16
	adafruit/Adafruit GFX Library @ ^1.12.6
	; blynkkk/Blynk @ ^1.3.2
build_flags =
	-D HAS_DISPLAY=1
	-D CORE_DEBUG_LEVEL=3
	-D CONFIG_FREERTOS_UNICORE=1
	-D CONFIG_BTDM_CTRL_BR_EDR_MAX_ACL_CONN=0
	-D CONFIG_BTDM_CTRL_BR_EDR_MAX_SYNC_CONN=0
	-D CONFIG_BTDM_CTRL_LEGACY_AUTH_VENDOR_EVT=0
	-D CONFIG_BLE_SCA=0

